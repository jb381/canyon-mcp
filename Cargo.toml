[package]
name = "canyon-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Read-only Canyon bicycle catalog CLI and MCP server"
license = "MIT"
repository = "https://github.com/jb381/canyon-mcp"
readme = "README.md"

[[bin]]
name = "canyon"
path = "src/bin/canyon.rs"

[[bin]]
name = "canyon-mcp"
path = "src/bin/canyon-mcp.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
clap = { version = "4.6", features = ["derive"] }
httpdate = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "zstd"] }
rmcp = { version = "3.12", default-features = false, features = ["macros", "server", "transport-io"] }
roxmltree = "0.21"
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
